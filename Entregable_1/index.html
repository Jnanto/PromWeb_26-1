<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giecom</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
    <link rel="stylesheet" href="./css/aos.css">
    <link rel="stylesheet" href="./css/lightbox.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand" href="#home">
                <img id="logoGie" src="./img/giecom.png" alt="Logo Giecom">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Menú">
                <span class="toggler-icon"></span>
                <span class="toggler-icon"></span>
                <span class="toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#home">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#sobre">Sobre Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="#eventos">Eventos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#equipos">Equipos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#resultados">Resultados</a></li>
                    <li class="nav-item"><a class="nav-link" href="#productos">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#galeria">Galería</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <section id="home" class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-particles" id="particles"></div>
        <div class="container hero-content text-center">
            <!-- <p class="hero-badge animate__animated animate__fadeInDown animate__delay-1s">
                <i class="fa-solid fa-atom"></i> Ingeniería de Sistemas
            </p> -->
            <h1 class="hero-title animate__animated animate__fadeInUp animate__delay-1s">
                Grupo de Investigación <br /><span class="gradient-text">GIECOM</span>
            </h1>
            <p class="hero-subtitle animate__animated animate__fadeIn animate__delay-2s">
                Gestión del Conocimiento, Electrónica, Informática y Comunicaciones.
            </p>
            <div class="hero-stats animate__animated animate__fadeInUp animate__delay-2s">
                <div class="stat-item"><span class="stat-number" data-target="48">0</span><span
                        class="stat-label">Proyectos</span></div>
                <div class="stat-item"><span class="stat-number" data-target="120">0</span><span
                        class="stat-label">Integrantes</span></div>
                <div class="stat-item"><span class="stat-number" data-target="32">0</span><span
                        class="stat-label">Publicaciones</span></div>
                <div class="stat-item"><span class="stat-number" data-target="8">0</span><span
                        class="stat-label">Años</span></div>
            </div>
            <div class="hero-btns animate__animated animate__fadeInUp animate__delay-2s">
                <a href="#sobre" class="btn-primary-custom">Conocer Más <i class="fa-solid fa-arrow-down"></i></a>
                <a href="#contacto" class="btn-outline-custom">Únete al Semillero</a>
            </div>
        </div>
        <div class="scroll-indicator">
            <div class="scroll-dot"></div>
        </div>
    </section>
    <script src="./js/bootstrap.js"></script>
    <script src="./js/aos.js"></script>
    <script src="./js/lightbox.js"></script>
    <script src="./js/script.js"></script>

</body>

</html>
